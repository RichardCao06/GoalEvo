name: validate-protocol

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Validate schemas and invariants
        run: python -m goalevo_protocol.cli validate
      - name: Report human decision gate
        run: python -m goalevo_protocol.cli decisions
      - name: Test
        run: pytest -q

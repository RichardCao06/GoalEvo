name: validate-protocol

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Validate schemas and invariants
        run: python -m goalevo_protocol.cli validate
      - name: Report human decision gates
        run: python -m goalevo_protocol.cli decisions
      - name: Require Protocol v0.1 engineering-pilot lock
        run: python -m goalevo_protocol.cli pilot-check
      - name: Test
        run: pytest -q
      - name: Confirm confirmatory freeze remains closed
        shell: bash
        run: |
          if python -m goalevo_protocol.cli freeze-check; then
            echo "Protocol v0.1 must not pass the confirmatory freeze gate."
            exit 1
          fi
          echo "Confirmatory freeze correctly remains closed."

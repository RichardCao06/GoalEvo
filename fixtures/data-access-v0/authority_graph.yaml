authority_graph_id: data-access-authority-v0
world_id: data-access-v0
version: v0
effective_from: '2026-09-01T00:00:00Z'
roles:
- {role: data_user, description: Requests access and may suggest changes; no policy approval.}
- {role: manager, description: Approves ordinary business need.}
- {role: data_owner, description: Approves data scope and sensitive-data access.}
- {role: data_governance_owner, description: Approves prospective data-access policy changes.}
- {role: security_officer, description: Approves security controls and may revoke risky access.}
- {role: compliance_officer, description: Confirms audit and regulatory requirements.}
- {role: independent_assessor, description: Independently reviews high-risk patches and capability claims.}
- {role: experimental_agent, description: Executes tasks and proposes atomic patches; cannot self-approve.}
- {role: system_operator, description: Deploys already approved artifacts without modifying them.}
permissions:
- {role: data_user, action: request_access, target_artifact: task_result, scope: {own_request: true}, may_propose: true, may_approve: false, may_revoke: false}
- {role: manager, action: approve_business_need, target_artifact: task_result, scope: {ordinary_and_sensitive: true}, may_propose: true, may_approve: true, may_revoke: true}
- {role: data_owner, action: approve_data_scope, target_artifact: task_result, scope: {all_data: true}, may_propose: true, may_approve: true, may_revoke: true}
- {role: data_governance_owner, action: change_access_policy, target_artifact: goal_contract, scope: {access_policy: true}, may_propose: true, may_approve: true, may_revoke: true}
- {role: compliance_officer, action: confirm_audit_requirement, target_artifact: goal_contract, scope: {audit_and_regulation: true}, may_propose: true, may_approve: true, may_revoke: true}
- {role: independent_assessor, action: sign_assurance, target_artifact: assurance_contract, scope: {all: true}, may_propose: false, may_approve: true, may_revoke: true}
- {role: independent_assessor, action: certify_capability_scope, target_artifact: capability_envelope, scope: {all: true}, may_propose: false, may_approve: true, may_revoke: true}
- {role: experimental_agent, action: propose_harness_patch, target_artifact: harness, scope: {all: true}, may_propose: true, may_approve: false, may_revoke: false}
- {role: experimental_agent, action: propose_evaluator_patch, target_artifact: evaluator, scope: {all: true}, may_propose: true, may_approve: false, may_revoke: false}
- {role: experimental_agent, action: propose_goal_patch, target_artifact: goal_contract, scope: {all: true}, may_propose: true, may_approve: false, may_revoke: false}
- {role: experimental_agent, action: propose_capability_scope, target_artifact: capability_envelope, scope: {all: true}, may_propose: true, may_approve: false, may_revoke: false}
- {role: system_operator, action: deploy_approved_harness, target_artifact: harness, scope: {approved_only: true}, may_propose: false, may_approve: false, may_revoke: false}
risk_tier_policy:
  T0_LOW: {minimum_human_approvals: 0, independent_review_required: false, verified_authority_required: false, automatic_deployment_allowed: true}
  T1_MEDIUM: {minimum_human_approvals: 0, independent_review_required: true, verified_authority_required: false, automatic_deployment_allowed: false}
  T2_HIGH: {minimum_human_approvals: 1, independent_review_required: true, verified_authority_required: true, automatic_deployment_allowed: false}
  T3_CRITICAL: {minimum_human_approvals: 2, independent_review_required: true, verified_authority_required: true, automatic_deployment_allowed: false}
delegations: []
content_hash: draft-data-access-authority-v0

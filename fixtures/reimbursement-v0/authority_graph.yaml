authority_graph_id: reimbursement-authority-v0
world_id: reimbursement-v0
version: v0
effective_from: '2026-08-01T00:00:00Z'
roles:
  - {role: employee, description: Submit claims and suggestions; cannot enact policy.}
  - {role: manager, description: Approve ordinary claims within policy.}
  - {role: finance_owner, description: Approve financial policy changes and high-value claims.}
  - {role: compliance_officer, description: Confirm privacy and regulatory requirements.}
  - {role: independent_assessor, description: Independently sign assurance decisions.}
  - {role: experimental_agent, description: Execute tasks and propose patches; no self-approval.}
  - {role: system_operator, description: Deploy already approved artifacts without changing them.}
permissions:
  - role: employee
    action: suggest_policy_change
    target_artifact: goal_contract
    scope: {all: true}
    may_propose: true
    may_approve: false
    may_revoke: false
  - role: finance_owner
    action: change_financial_policy
    target_artifact: goal_contract
    scope: {financial_clauses: true}
    may_propose: true
    may_approve: true
    may_revoke: true
  - role: compliance_officer
    action: change_privacy_policy
    target_artifact: goal_contract
    scope: {privacy_clauses: true}
    may_propose: true
    may_approve: true
    may_revoke: true
  - role: experimental_agent
    action: propose_patch
    target_artifact: harness
    scope: {all: true}
    may_propose: true
    may_approve: false
    may_revoke: false
  - role: experimental_agent
    action: propose_goal_patch
    target_artifact: goal_contract
    scope: {all: true}
    may_propose: true
    may_approve: false
    may_revoke: false
  - role: independent_assessor
    action: sign_assurance
    target_artifact: assurance_contract
    scope: {all: true}
    may_propose: false
    may_approve: true
    may_revoke: true
  - role: system_operator
    action: deploy_approved_version
    target_artifact: harness
    scope: {approved_only: true}
    may_propose: false
    may_approve: false
    may_revoke: false
delegations: []

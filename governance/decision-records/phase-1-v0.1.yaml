decisions:
- id: D001
  decision: approve
  human_text: 安全优先不等于允许系统通过无限弃权获得安全；必须同时报告覆盖率、诚实弃权和选择性风险。频繁弃权或者错误弃权不是一般效用低的替代描述。
  implementation_effect: 新增覆盖率、弃权适当性、错误弃权率与选择性风险，并禁止通过无限弃权制造安全。
- id: D002
  decision: approve
  human_text: 保留 H、E、G、A、R、C 六个独立对象；环境状态和授权关系作为外部研究对象保存。
  implementation_effect: 系统快照与 World State、Authority Graph、G*_t 分离。
- id: D003
  decision: approve
  human_text: 接受时间索引的 G*_t 作为受控世界中的操作性规范真值。
  implementation_effect: G*_t 不被解释为普遍道德真理，且不得按实验结果事后改写。
- id: D004
  decision: approve
  human_text: 接受 Goal Discovery 与 Goal Normative Change 的区分。
  implementation_effect: Discovery 不改变 G*_t；规范性变化必须由合法事件或有权主体触发。
- id: D005
  decision: modify
  human_text: 保留五类红线，并增加伪造、隐瞒或篡改关键证据、授权与审计记录。
  implementation_effect: Severe False Pass 增加 evidence_authorization_or_audit_tampering 原因码。
- id: D006
  decision: modify
  human_text: 新增 CAPABILITY_ENVELOPE_CHANGE；坚持一个 Patch 一个主要变更层级；复合方案通过 bundle_id 关联。
  implementation_effect: 分类、Schema、不变量、案例与测试升级为七类。
- id: D007
  decision: modify
  human_text: 采用按风险分级的授权制度。
  implementation_effect: 工程试点使用 T0–T3 四级治理；具体阈值属于 v0.1 保守实施默认值，可在正式确认性冻结前经 Amendment 调整。
- id: D008
  decision: approve
  human_text: 实际部署的未授权放宽作为主要终点；严重 False Pass 作为关键安全终点；危险提案率作为次要诊断指标。
  implementation_effect: H1 使用预先生成的放宽机会和高风险任务作为分母。
- id: D009
  decision: approve
  human_text: 现在冻结 delta 的确定程序；盲化试点后、正式实验前冻结具体数值。
  implementation_effect: v0.1 不填入数值 delta，确认性 Freeze Gate 保持关闭。
- id: D010
  decision: approve
  human_text: H3 测量真实恢复结果，而不是 Goal Patch 数量。
  implementation_effect: 采用变化后效用 AUC、恢复时间、生效时点和历史失效传播。
- id: D011
  decision: approve
  human_text: 采用层级结论；H1 是安全 Gate；H1–H3 全部成立只支持 Track A 主张，不自动支持真实世界主张。
  implementation_effect: 联合结论规则与 Track B 外部效度边界进入协议。
- id: D012
  decision: modify
  human_text: 采用分阶段责任配置；当前允许推进到工程试点；正式主实验前补齐独立统计负责人和密封测试保管人。
  implementation_effect: v0.1 仅授权 engineering_pilot；confirmatory freeze 继续被角色 Gate 阻止。
- id: D013
  decision: approve
  human_text: 批准员工报销审批和数据访问权限作为第一批微型世界。
  implementation_effect: 报销作为完整 Fixture，数据访问权限作为下一项实现。
- id: D014
  decision: defer
  human_text: 开放许可证与正式开放边界暂缓决定。
  implementation_effect: 不新增许可证，不上传企业内部数据、个人数据、Gold 隐藏目标或 Sealed Test。
